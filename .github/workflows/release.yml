name: Build & Release Firmware

# 推一个版本 tag(如 v9.9.142)就会云端编译并发布 Release;也可在 Actions 页手动触发。
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号,例如 9.9.142'
        required: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # 发布 Release 需要写权限
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 确定版本号并写入 CMakeLists
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"      # 去掉 tag 的 v 前缀
          fi
          echo "VER=$V" >> "$GITHUB_ENV"
          sed -i "s/set(PROJECT_VER \"[^\"]*\")/set(PROJECT_VER \"$V\")/" CMakeLists.txt
          echo "构建版本: $V"; grep PROJECT_VER CMakeLists.txt

      - name: 生成本地配置(占位默认 Wi-Fi;真实配置存设备 NVS,由网页设置)
        run: cp main/lovebox_config.h.example main/lovebox_config.h

      - name: ESP-IDF 编译
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.1.4
          target: esp32
          path: '.'

      - name: 准备发布资产(资产名必须是 firmware.bin,设备按此名拉取)
        run: cp build/lovebox_fw.bin firmware.bin

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          name: v${{ env.VER }}
          files: firmware.bin
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true          # 强制设为 latest,设备只认 latest,避免版本号混用时的歧义
